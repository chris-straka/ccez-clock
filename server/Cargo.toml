[package]
name = "ccez-clock-server"
version = "0.1.0"
edition = "2024"
description = "The owner's alarms and timer, shared by agents on the tailnet and ccez-clock on the phone, on the Mac mini."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
